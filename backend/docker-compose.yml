services:
  db:
    image: postgres:16-alpine
    container_name: linkord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkord
      POSTGRES_PASSWORD: linkord_dev_password
      POSTGRES_DB: linkord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
