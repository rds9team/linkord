          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://linkord.net/discover?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"

        },
        {
          "@type": "WebApplication",
